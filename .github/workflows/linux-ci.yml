name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -e .
      - name: Run Python and conformance suites
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m unittest discover -s conformance -p "test_*.py" -v
      - name: Smoke-test module entry points
        run: |
          python -m cmpath.cli --help
          python -m cmpath.doctor --json --skip-native --skip-mcp

  native-release:
    name: Native, race and release validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Go from native module
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -e .
      - name: Build Linux native executables
        run: |
          python scripts/build_native.py --goos linux --goarch amd64 --output native/bin/linux
          echo "CMP_NATIVE_BINARY=$PWD/native/bin/linux/cmpath-native" >> "$GITHUB_ENV"
      - name: Run Go race suite
        working-directory: native
        run: go test -buildvcs=false -race -count=1 ./...
      - name: Run Python and conformance suites with native bridge
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m unittest discover -s conformance -p "test_*.py" -v
      - name: Validate isolated release and vendored rebuild
        run: python scripts/validate_release.py --go go
